# Per-brand facts an implementation lead captures on the kickoff call, on top of what the
# onboarded ledger shows: vendors, retailer terms, SKU names, cash buffer policy, credit line.
# Built by Avinash Rayudu. All brands and numbers are synthetic.

defaults:
  refund_rate: 0.055
  fee_rate: 0.032
  chargeback_rate: 0.002
  payout_lag_share: 0.2857          # about 2 of 7 days of sales are paid out the following week
  amz_fee_rate: 0.30
  packaging_pct: 0.010
  saas_annual: 9000
  loc_apr: 0.11                     # illustrative credit line rate
  savings_apy: 0.0258               # illustrative savings yield
  opening_weeks_of_outflow: 3.0     # opening cash when the brand did not give a figure
  buffer_weeks_of_outflow: 2.0      # cash buffer policy when the brand did not give one

